[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtester"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "streamlit>=1.38",
    "streamlit-authenticator>=0.4,<0.5",
    "plotly>=5.24",
    "pyyaml>=6.0",
    "alpaca-py>=0.43",
    "keyring>=25.0",
    "coinbase-advanced-py>=1.8",
    "krakenex>=2.2",
    "tastytrade>=9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
